<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="solarGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#f97316" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="100" height="100" rx="22" fill="#070b13" />

  <!-- Outer Glow Ring -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="rgba(249, 115, 22, 0.25)" stroke-width="1.5" />

  <!-- Solar Rays Group -->
  <g fill="url(#solarGlow)" filter="url(#neon)">
    <!-- 12 Cardinal and Intercardinal Rays -->
    <!-- 0 deg (Top) -->
    <polygon points="50,11 46,24 54,24" />
    <!-- 30 deg -->
    <polygon points="69.5,16.2 63.5,27.7 70.4,31.7" />
    <!-- 60 deg -->
    <polygon points="83.8,30.5 73.3,37.6 77.3,44.5" />
    <!-- 90 deg (Right) -->
    <polygon points="89,50 76,46 76,54" />
    <!-- 120 deg -->
    <polygon points="83.8,69.5 77.3,55.5 73.3,62.4" />
    <!-- 150 deg -->
    <polygon points="69.5,83.8 70.4,68.3 63.5,72.3" />
    <!-- 180 deg (Bottom) -->
    <polygon points="50,89 54,76 46,76" />
    <!-- 210 deg -->
    <polygon points="30.5,83.8 36.5,72.3 29.6,68.3" />
    <!-- 240 deg -->
    <polygon points="16.2,69.5 26.7,62.4 22.7,55.5" />
    <!-- 270 deg (Left) -->
    <polygon points="11,50 24,54 24,46" />
    <!-- 300 deg -->
    <polygon points="16.2,30.5 22.7,44.5 26.7,37.6" />
    <!-- 330 deg -->
    <polygon points="30.5,16.2 29.6,31.7 36.5,27.7" />
  </g>

  <!-- Sun Disk Border -->
  <circle cx="50" cy="50" r="23" fill="#0b1120" stroke="url(#solarGlow)" stroke-width="2.5" filter="url(#neon)" />
  <circle cx="50" cy="50" r="19.5" fill="none" stroke="rgba(249, 115, 22, 0.4)" stroke-width="1" />

  <!-- Center Heartbeat Solar Pulse Wave -->
  <path
    d="M 28,50 L 40,50 L 45,34 L 51,64 L 56,42 L 60,50 L 72,50"
    fill="none"
    stroke="url(#pulseGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#neon)"
  />
</svg>
